<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear Diary — Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="background-glow"></div>

<div class="portal-container">

    <h1 class="logo">DEAR<br>DIARY</h1>
    <p class="portal-subtitle">ENTER THE ARCHIVE</p>

    <form id="loginForm" class="login-form">
        <input type="text" id="username" placeholder="Username..." required>
        <input type="password" id="password" placeholder="Password..." required>
        <button type="submit" class="login-btn">Unlock</button>
    </form>

    <div class="error-message" id="errorMessage"></div>

    <p class="bottom-link">
        New writer? <a href="#">Create account</a>
    </p>

</div>

<script src="login.js"></script>

</body>
</html>
