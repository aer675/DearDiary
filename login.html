<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dear Diary - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

    <div class="auth-wrapper">
        
        <h1 class="auth-logo">DEAR<br>DIARY</h1>
        <p class="auth-dev">Developed by Third Hour Co</p>

        <form class="auth-form" id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>

            <button type="submit" class="auth-btn">
                Login
            </button>
        </form>

        <form class="auth-form hidden" id="signupForm">
            <input type="text" placeholder="Username" required>
            <input type="email" id="signupEmail" placeholder="Email" required>
            <input type="password" id="signupPassword" placeholder="Password" required>
            <input type="date" required>

            <button type="submit" class="login-btn">
                Sign Up
            </button>
        </form>

        <p class="switch-text">
            <span id="switchLabel">
                New to Writers of Dear Diary?
            </span>
            <a href="#" id="switchLink" onclick="toggleForm()">
                Sign up instead
            </a>
        </p>

        <div class="auth-footer">
            <div class="footer-logo">DEAR<br>DIARY</div>
            <p>Third Hour Co. All rights reserved.</p>
        </div>

    </div>

    <script type="module" src="js/firebase.js"></script>

    <script>
        function toggleForm() {
            const login = document.getElementById("loginForm");
            const signup = document.getElementById("signupForm");
            const label = document.getElementById("switchLabel");
            const link = document.getElementById("switchLink");

            if (login.classList.contains("hidden")) {
                login.classList.remove("hidden");
                signup.classList.add("hidden");
                label.innerText = "New to Writers of Dear Diary?";
                link.innerText = "Sign up instead";
            } else {
                login.classList.add("hidden");
                signup.classList.remove("hidden");
                label.innerText = "Already a writer?";
                link.innerText = "Log in instead";
            }
        }
    </script>
</body>
</html>
