<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dear Diary - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

    <div class="auth-wrapper">
        
        <!-- LOGO -->
        <h1 class="auth-logo">DEAR<br>DIARY</h1>
        <p class="auth-dev">Developed by Third Hour Co</p>

        <!-- FORM -->
        <form class="auth-form">
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>

            <button type="submit" class="auth-btn">
                Login
            </button>
        </form>

        <p class="auth-alt">
            New to Writers of Dear Diary?
            <a href="signup.html">Sign up instead</a>
        </p>


        <!-- FOOTER -->
        <div class="auth-footer">
            <div class="footer-logo">DEAR<br>DIARY</div>
            <p>Third Hour Co. All rights reserved.</p>
        </div>


    </div>

        <div class="publisher-logo">
            <img src="images/logos/logos.png" alt="Publisher Logo">
        </div>


</body>
</html>
