<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dear Diary – Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Main Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="vignette"></div>

<div class="mobile-container">

    <!-- HEADER -->
    <header>
        <nav class="navbar">
            <div class="menu-icon" onclick="toggleMenu()" role="button" aria-label="Open Menu">☰</div>
            <a href="index.html" class="auth-link">Back to Home</a>
        </nav>

        <div id="sideNav" class="side-nav">
            <a href="javascript:void(0)" class="closebtn" onclick="toggleMenu()">&times;</a>
            <a href="index.html">Home</a>
            <a href="world.html">World</a>
            <a href="merch.html">Merch</a>
            <a href="hub.html">Community Hub</a>
            <a href="profile.html">My Profile</a>
        </div>
    </header>

    <!-- LOGIN SECTION -->
    <main>
        <section class="auth-section">

            <div class="auth-box">

                <h3 class="journal-text">Welcome back, Writer.</h3>

                <form>

                    <div class="input-group">
                        <input type="text" placeholder="Username..." class="horror-input" required>
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Password..." class="horror-input" required>
                    </div>

                    <button type="submit" class="btn-primary">
                        ENTER THE DIARY
                    </button>

                </form>

                <p class="small-hint">
                    New writer? <a href="signup.html">Sign up here</a>
                </p>

            </div>

        </section>
    </main>

    <!-- FOOTER -->
    <footer class="global-footer">
        <div class="footer-logo">DEAR<br>DIARY</div>
        <p class="copyright-text">
            Third Hour Co. All rights reserved.
        </p>

        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-discord"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#"><i class="fa-brands fa-google"></i></a>
            <a href="#"><i class="fa-brands fa-steam"></i></a>
        </div>
    </footer>

</div>

<script src="js/script.js"></script>

</body>
</html>
