<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dear Diary - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">


    <div class="auth-wrapper">
        
        <!-- LOGO -->
        <h1 class="auth-logo">DEAR<br>DIARY</h1>
        <p class="auth-dev">Developed by Third Hour Co</p>

        <!-- LOGIN FORM -->
        <form class="auth-form" id="loginForm">

            <input type="email" id="loginEmail" placeholder="Email" required>

            <input type="password" id="loginPassword" placeholder="Password" required>

            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>


        <form class="auth-form hidden" id="signupForm">

            <input type="text" id="signupUsername" placeholder="Username" required>

            <input type="email" id="signupEmail" placeholder="Email" required>

            <input type="password" id="signupPassword" placeholder="Password" required>

            <input type="date" id="signupDOB" required>

            <button type="submit" class="auth-btn">
                Sign Up
            </button>

        </form>



        <p class="switch-text">

            <span id="switchLabel">

                New to Writers of Dear Diary?

            </span>

        <a href="#" onclick="toggleForm(); return false;">
            Sign up instead
        </a>


        </p>

        



        <!-- FOOTER -->
        <div class="auth-footer">
            <div class="footer-logo">DEAR<br>DIARY</div>
            <p>Third Hour Co. All rights reserved.</p>
        </div>


    </div>
            <!-- SCRIPTS -->

        <script src="js/script.js"></script>

        <script type="module" src="js/firebase.js"></script>

</body>
</html>


</body>
</html>
