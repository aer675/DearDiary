<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dear Diary - Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: sans-serif;
            color: #fff;
        }

        .jmadh-font { font-family: 'Just Me Again Down Here', cursive; }

        /* Navigation Bar (Reused) */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            background-color: rgba(5, 5, 5, 0.95);
            padding: 15px 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; border-bottom: 1px solid #333;
        }
        .audio-toggle { display: flex; align-items: center; }
        .audio-toggle img { width: 30px; cursor: pointer; }
        .pause-btn { display: none; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a {
            color: #fff; text-decoration: none; font-weight: bold;
            font-size: 0.9rem; padding: 5px 10px; border-radius: 4px; transition: 0.3s;
        }
        .nav-links a:hover { background-color: #ff0000; color: #000; }
        
        /* Highlighting 'Merch' in the Navbar */
        .active-link { border-bottom: 2px solid #ff0000; }

        /* Merch Main Container */
        .merch-container {
            /* I added a dark gradient overlay so your text pops against the background! */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('images/merch2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 60px; /* Offsets the navbar */
            text-align: center;
        }

        /* Merch Elements */
        .apple-icon {
            width: 50px; /* Adjust size if needed */
            margin-bottom: 15px;
            filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.8));
        }

        .shop-title {
            color: #cc0000;
            font-size: 5rem;
            margin: 0;
            line-height: 0.9;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            letter-spacing: 2px;
        }

        .shop-subtitle {
            color: #ffffff;
            font-size: 2.5rem;
            margin: 15px 0 35px 0;
            letter-spacing: 5px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }

        .closed-sign {
            max-width: 300px;
            width: 80%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            transition: transform 0.3s;
        }
        .closed-sign:hover {
            transform: scale(1.05); /* Slight pop when hovered */
        }

        /* Footer from your screenshot */
        .footer {
            background-color: #111;
            padding: 40px 20px;
            text-align: center;
            border-top: 2px solid #222;
        }
        .footer-logo {
            width: 120px; /* For your sticky note logo */
            margin-bottom: 15px;
        }
        .footer-text {
            color: #ffffff;
            font-family: 'Just Me Again Down Here', cursive;
            font-size: 1.2rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .social-placeholder {
            color: #ffffff;
            font-family: sans-serif;
            font-size: 0.9rem;
            letter-spacing: 10px;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="audio-toggle" onclick="toggleAudio()">
            <img src="images/playbutton.png" id="playBtn" alt="Play Music">
            <img src="images/pausebutton.png" id="pauseBtn" class="pause-btn" alt="Pause Music">
        </div>
        <div class="nav-links">
            <a href="hub.html">Community</a>
            <a href="characters.html">Characters</a>
            <a href="merch.html" class="active-link">Merch</a> <a href="profile.html">Profile</a>
        </div>
    </nav>

    <div class="merch-container">
        <img src="images/rottenapple.png" class="apple-icon" alt="Rotten Apple">
        
        <h1 class="shop-title jmadh-font">DEAR<br>DIARY</h1>
        <h2 class="shop-subtitle jmadh-font">SHOP</h2>
        
        <img src="images/merch1.png" class="closed-sign" alt="Sorry We're Closed">
    </div>

    <div class="footer">
        <img src="images/sticky-logo.png" class="footer-logo" alt="Dear Diary Note">
        
        <p class="footer-text">Third Hour Co. All rights reserved.</p>
        
        <div class="social-placeholder">
            X | IG | FB | YT | DC | TT 
        </div>
    </div>

    <script>
        let isPlaying = false;
        function toggleAudio() {
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            if (isPlaying) { playBtn.style.display = 'block'; pauseBtn.style.display = 'none'; } 
            else { playBtn.style.display = 'none'; pauseBtn.style.display = 'block'; }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
