<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dear Diary - Characters</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles & Background */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            background-image: url('images/murder-board.png'); /* Your creepy background */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: sans-serif;
            color: #fff;
        }

        .jmadh-font {
            font-family: 'Just Me Again Down Here', cursive;
        }

        /* Top Navigation Bar */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(10, 10, 10, 0.9); /* Slightly transparent black */
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 2px solid #333;
        }

        /* Audio Toggle Area */
        .audio-toggle {
            display: flex;
            align-items: center;
        }
        .audio-toggle img {
            width: 30px;
            cursor: pointer;
        }
        .pause-btn {
            display: none;
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            gap: 15px;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 5px 10px;
            border-radius: 4px;
            transition: 0.3s;
        }
        .nav-links a:hover {
            background-color: #ff0000;
            color: #000;
        }
        .active-link {
            border-bottom: 2px solid #ff0000; /* Highlights the current page */
        }

        /* Main Content - Stacked Characters */
        .characters-container {
            margin-top: 100px; /* Pushes content down so navbar doesn't cover it */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding-bottom: 60px;
        }

        .character-card {
            cursor: pointer;
            transition: transform 0.3s;
        }

        .character-card:hover {
            transform: scale(1.05); /* Slight zoom when hovered */
        }

        .character-card img {
            width: 200px; /* Adjust this to make the character portraits bigger/smaller */
            border: 3px solid #fff;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }

        /* Modal (Pop-up) Styles */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background-color: #efeade; /* A slightly aged paper color */
            color: #000;
            padding: 30px;
            border-radius: 5px;
            max-width: 400px;
            width: 80%;
            position: relative;
            text-align: center;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: #555;
        }
        .close-btn:hover { color: #ff0000; }

        .modal-title {
            font-size: 3rem;
            margin: 0 0 10px 0;
            color: #8b0000; /* Dark blood red */
        }

        .modal-desc {
            font-size: 1.1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="audio-toggle" onclick="toggleAudio()">
            <img src="images/playbutton.png" id="playBtn" alt="Play Music">
            <img src="images/pausebutton.png" id="pauseBtn" class="pause-btn" alt="Pause Music">
        </div>
        
        <div class="nav-links">
            <a href="hub.html">Community</a>
            <a href="characters.html" class="active-link">Characters</a>
            <a href="merch.html">Merch</a>
            <a href="profile.html">Profile</a>
        </div>
    </nav>

    <div class="characters-container">
        
        <div class="character-card" onclick="openModal('Gu Wei Yi', 'A Singaporean Girl with her diary. Tries her best to fit in.')">
            <img src="images/weiyi.png" alt="Wei Yi">
        </div>

        <div class="character-card" onclick="openModal('The Bully', 'Relentless and cruel. Hides a dark secret behind a popular facade.')">
            <img src="images/bully.png" alt="The Bully">
        </div>

        <div class="character-card" onclick="openModal('The Mom', 'Overbearing and anxious. What is she trying to protect Wei Yi from?')">
            <img src="images/mom.png" alt="The Mom">
        </div>

    </div>

    <div class="modal-overlay" id="characterModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 class="modal-title jmadh-font" id="modalName">Character Name</h2>
            <p class="modal-desc" id="modalDescription">Character description goes here.</p>
        </div>
    </div>

    <script>
        // Audio Toggle Logic
        let isPlaying = false;
        function toggleAudio() {
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            if (isPlaying) {
                playBtn.style.display = 'block';
                pauseBtn.style.display = 'none';
            } else {
                playBtn.style.display = 'none';
                pauseBtn.style.display = 'block';
            }
            isPlaying = !isPlaying;
        }

        // Modal (Pop-up) Logic
        const modal = document.getElementById('characterModal');
        const modalName = document.getElementById('modalName');
        const modalDesc = document.getElementById('modalDescription');

        function openModal(name, description) {
            modalName.innerText = name;
            modalDesc.innerText = description;
            modal.style.display = 'flex'; // Shows the hidden box
        }

        function closeModal() {
            modal.style.display = 'none'; // Hides the box
        }

        // Close modal if user clicks the dark background outside the box
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
