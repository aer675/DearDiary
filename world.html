<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dear Diary - Characters</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        .jmadh-font { font-family: 'Just Me Again Down Here', cursive; }

        /* Navigation Bar */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            background-color: rgba(5, 5, 5, 0.95);
            padding: 15px 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 1000; border-bottom: 1px solid #333;
        }
        
        .audio-toggle { display: flex; align-items: center; }
        .audio-toggle img { width: 30px; cursor: pointer; }
        .pause-btn { display: none; }
        
        /* Desktop Nav Menu */
        .nav-menu { display: flex; gap: 15px; align-items: center; }
        .nav-menu a {
            color: #fff; text-decoration: none; font-weight: bold;
            font-size: 0.9rem; padding: 5px 10px; border-radius: 4px; transition: 0.3s;
        }
        .nav-menu a:hover { background-color: #ff0000; color: #000; }
        .active-link { border-bottom: 2px solid #ff0000; }

        /* Mobile Hamburger Icon (Hidden on Desktop) */
        .hamburger {
            display: none;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            user-select: none;
            margin-top: -5px;
        }

        /* Section Layouts */
        .board-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-position: center;
            background-attachment: scroll;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 3px solid #111;
            /* Zoom in slightly to hide edges for sections 2 & 3 */
            background-size: 102% auto; 
        }

        /* Center Character Portraits */
        .center-char {
            z-index: 10;
            width: 220px;
            cursor: pointer;
            border: none;
            box-shadow: 0 15px 30px rgba(0,0,0,0.9);
            transition: transform 0.3s;
            background-color: #000;
        }
        .center-char:hover { transform: scale(1.05); }

        /* Scattered Polaroids/Clues */
        .scatter {
            position: absolute;
            max-width: 180px;
            z-index: 5;
            box-shadow: 3px 8px 15px rgba(0,0,0,0.7);
        }

        /* Creepy Red Text */
        .creepy-text {
            position: absolute;
            color: #cc0000;
            font-size: 2.5rem;
            z-index: 8;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* --- EXACT IMAGE PLACEMENTS --- */
        .s1-item1 { top: 15%; left: 8%; transform: rotate(-15deg); max-width: 200px; } 
        .s1-item2 { top: 25%; right: 10%; transform: rotate(12deg); max-width: 160px; } 
        .s1-item3 { bottom: 15%; left: 12%; transform: rotate(8deg); max-width: 190px; } 
        .s1-item4 { bottom: 20%; right: 15%; transform: rotate(-10deg); max-width: 170px; } 
        .text-1 { top: 12%; left: 35%; transform: rotate(-5deg); } 

        .s2-item5 { top: 15%; right: 12%; transform: rotate(-12deg); max-width: 190px; } 
        .s2-item6 { top: 35%; left: 8%; transform: rotate(-8deg); max-width: 170px; z-index: 5; } 
        .s2-item7 { top: 22%; left: 18%; transform: rotate(15deg); max-width: 180px; z-index: 6; } 
        .s2-item9 { bottom: 20%; right: 15%; transform: rotate(5deg); max-width: 180px; } 
        .text-2 { bottom: 28%; left: 22%; transform: rotate(10deg); } 

        .s3-item10 { top: 32%; left: 22%; transform: rotate(-25deg); max-width: 120px; } 
        .s3-item11 { top: 40%; left: 10%; transform: rotate(5deg); max-width: 180px; z-index: 4; } 
        .s3-item6-dup { bottom: 15%; left: 8%; transform: rotate(15deg); max-width: 170px; } 
        .text-3 { top: 20%; right: 18%; transform: rotate(-8deg); } 

        /* Modal Styles */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9); z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-box {
            background-color: #efeade; color: #000; padding: 30px; border-radius: 5px;
            max-width: 400px; width: 80%; position: relative; text-align: center;
            box-shadow: 0 0 30px rgba(255,0,0,0.4);
        }
        .close-btn {
            position: absolute; top: 10px; right: 15px; font-size: 24px;
            font-weight: bold; cursor: pointer; color: #555;
        }
        .close-btn:hover { color: #ff0000; }
        .modal-title { font-size: 3rem; margin: 0 0 10px 0; color: #8b0000; }
        .modal-desc { font-size: 1.1rem; line-height: 1.5; font-weight: bold; }

        /* --- MOBILE RESPONSIVE TWEAKS --- */
        @media (max-width: 768px) {
            .hamburger {
                display: block; 
            }
            .nav-menu {
                display: none; 
                position: absolute;
                top: 60px;
                right: 20px;
                background-color: rgba(10, 10, 10, 0.95);
                padding: 20px;
                border-radius: 8px;
                border: 1px solid #333;
                box-shadow: 0 5px 15px rgba(0,0,0,0.8);
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            .nav-menu.active {
                display: flex; 
            }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="audio-toggle" onclick="toggleAudio()">
            <img src="images/playbutton.png" id="playBtn" alt="Play Music">
            <img src="images/pausebutton.png" id="pauseBtn" class="pause-btn" alt="Pause Music">
        </div>

        <div class="hamburger" onclick="toggleMenu()">
            &#9776; 
        </div>

        <div class="nav-menu" id="navMenu">
            <a href="hub.html">Community</a>
            <a href="characters.html" class="active-link">Characters</a>
            <a href="merch.html">Merch</a>
            <a href="profile.html">Profile</a>
        </div>
    </nav>

    <div class="board-section" style="background-image: url('images/bg4char1.png');">
        <img src="images/weiyi.png" class="center-char" onclick="openModal('Gu Wei Yi 顾唯一', 'A Singaporean Girl with her diary. Tries her best to fit in.')" alt="Wei Yi">
        
        <img src="images/img4char1.png" class="scatter s1-item1" alt="Clue 1">
        <img src="images/img4char2.png" class="scatter s1-item2" alt="Clue 2">
        <img src="images/img4char3.png" class="scatter s1-item3" alt="Clue 3">
        <img src="images/img4char4.png" class="scatter s1-item4" alt="Clue 4">
        <div class="creepy-text text-1 jmadh-font">autopsy shows axe wounds...</div>
    </div>

    <div class="board-section" style="background-image: url('images/bg4char2.png');">
        <img src="images/mom.png" class="center-char" onclick="openModal('Mrs Gu Mei Qi 顾美琪', 'Wei Yi’s one and only family  mother. Known for being strict.')" alt="The Mom">
        
        <img src="images/img4char5.png" class="scatter s2-item5" alt="Clue 5">
        <img src="images/img4char6.png" class="scatter s2-item6" alt="Clue 6">
        <img src="images/img4char7.png" class="scatter s2-item7" alt="Clue 7">
        <img src="images/img4char9.png" class="scatter s2-item9" alt="Clue 9">
        <div class="creepy-text text-2 jmadh-font">hallucinations?</div>
    </div>

    <div class="board-section" style="background-image: url('images/bg4char2.png');">
        <img src="images/bully.png" class="center-char" onclick="openModal('Wen Zi Qian 温子谦', 'Wei Yi’s school bully. Known for bullying Wei Yi since Secondary 2. ')" alt="The Bully">
        
        <img src="images/img4char10.png" class="scatter s3-item10" alt="Clue 10">
        <img src="images/img4char11.png" class="scatter s3-item11" alt="Clue 11">
        <img src="images/img4char6.png" class="scatter s3-item6-dup" alt="Clue 6 Duplicate">
        <div class="creepy-text text-3 jmadh-font">it doesn't make sense.</div>
    </div>

    <div class="modal-overlay" id="characterModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 class="modal-title jmadh-font" id="modalName">Name</h2>
            <p class="modal-desc" id="modalDescription">Description.</p>
        </div>
    </div>

    <script>
        // Audio Setup
        const bgMusic = new Audio('leiwin_project_music.mp3'); 
        bgMusic.loop = true; 

        // Audio Toggle
        let isPlaying = false;
        function toggleAudio() {
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            if (isPlaying) { 
                bgMusic.pause();
                playBtn.style.display = 'block'; 
                pauseBtn.style.display = 'none'; 
            } else { 
                bgMusic.play();
                playBtn.style.display = 'none'; 
                pauseBtn.style.display = 'block'; 
            }
            isPlaying = !isPlaying;
        }

        // Dropdown Menu Logic
        function toggleMenu() {
            const menu = document.getElementById('navMenu');
            menu.classList.toggle('active');
        }

        // Modal Logic
        const modal = document.getElementById('characterModal');
        function openModal(name, description) {
            document.getElementById('modalName').innerText = name; 
            document.getElementById('modalDescription').innerText = description;
            modal.style.display = 'flex';
        }
        function closeModal() { modal.style.display = 'none'; }
        window.onclick = function(event) { if (event.target == modal) { closeModal(); } }
    </script>
</body>
</html>
