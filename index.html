<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dear Diary - Explore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Dark theme between images */
            color: #ffffff;
            font-family: sans-serif;
        }

        .jmadh-font {
            font-family: 'Just Me Again Down Here', cursive;
        }

        /* Full Screen Background Setup */
        .bg-section {
            height: 100vh; /* Takes up the full height of the screen */
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Creates a cool parallax scrolling effect */
            background-repeat: no-repeat;
        }

        /* Your Specific Backgrounds (Make sure these are in an 'images' folder!) */
        .bg1 { background-image: url('images/bg4index1.png'); position: relative; display: flex; justify-content: center; align-items: center; }
        .bg2 { background-image: url('images/bg4index2.png'); }
        .bg3 { background-image: url('images/bg4index3.png'); }
        .bg4 { background-image: url('images/bg4index4.png'); }
        .bg5 { background-image: url('images/bg4index5.png'); }
        .bg6 { background-image: url('images/bg4index6.png'); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }

        /* Navigation / Top Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .audio-toggle img {
            width: 40px; /* Keeps the buttons small */
            cursor: pointer;
        }
        
        .pause-btn {
            display: none; /* Hidden by default until clicked */
        }

        .login-btn {
            background-color: #ffffff;
            color: #000000;
            padding: 10px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
        }
        
        .login-btn:hover { background-color: #cccccc; }

        /* Section 1 Center Content */
        .hero-center {
            text-align: center;
        }

        .hero-center img {
            max-width: 150px; /* Adjust rotten apple size here */
        }

        .main-title {
            color: #ff0000; /* Red text */
            font-size: 6rem;
            margin: 10px 0 0 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .dev-text {
            font-size: 1rem;
            color: #aaaaaa;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Text Dividers Between Sections */
        .divider {
            padding: 80px 20px;
            text-align: center;
            font-size: 4rem;
            background-color: #0a0a0a;
        }

        /* Section 6 Content */
        .club-text {
            font-size: 3rem;
            max-width: 800px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .signup-large {
            background-color: #ff0000;
            color: #ffffff;
            padding: 15px 40px;
            font-size: 2.5rem;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .signup-large:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <section class="bg-section bg1">
        
        <div class="top-bar">
            <div class="audio-toggle" onclick="toggleAudio()">
                <img src="images/playbutton.png" id="playBtn" alt="Play Music">
                <img src="images/pausebutton.png" id="pauseBtn" class="pause-btn" alt="Pause Music">
            </div>
            
            <a href="login.html" class="login-btn">Login / Sign Up</a>
        </div>

        <div class="hero-center">
            <img src="images/rottenapple.png" alt="Rotten Apple">
            <h1 class="main-title jmadh-font">Dear Diary</h1>
            <p class="dev-text">Developed by Third Hour Co</p>
        </div>
    </section>

    <div class="divider jmadh-font">Explore through WeiYin's Diary</div>

    <section class="bg-section bg2"></section>

    <div class="divider jmadh-font">Can you survive?</div>

    <section class="bg-section bg3"></section>

    <div class="divider jmadh-font">Explore</div>

    <section class="bg-section bg4"></section>

    <div class="divider jmadh-font">Solve Puzzles</div>

    <section class="bg-section bg5"></section>

    <section class="bg-section bg6">
        <p class="club-text jmadh-font">
            Join the writers of Dear Diary club. Sign up to join our Dear Diary Club and receive monthly newsletters & exclusive rewards. Mystery awaits.
        </p>
        <a href="login.html" class="signup-large jmadh-font">Sign Up</a>
    </section>

    <script>
        let isPlaying = false;
        
        function toggleAudio() {
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            
            if (isPlaying) {
                // Currently playing, so pause it
                playBtn.style.display = 'block';
                pauseBtn.style.display = 'none';
                // Note: We can add actual audio code here later!
            } else {
                // Currently paused, so play it
                playBtn.style.display = 'none';
                pauseBtn.style.display = 'block';
                // Note: We can add actual audio code here later!
            }
            
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
